<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evidență Evenimente Sociale - Mandachi Hotel & Spa</title>
    
    <script>
        // Global Error Handler pentru protocolul file://
        window.onerror = function(msg, url, line) { 
            var root = document.getElementById('root');
            if (root) {
                root.innerHTML = '<div style="background:#0b0f19; color:#f87171; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; font-family:sans-serif; text-align:center;"><h2 style="font-size:24px; font-weight:bold; margin-bottom:15px;">Eroare Critică de Încărcare (CORS / Script)</h2><p style="background:#1e293b; padding:15px; border-radius:10px; color:#cbd5e1;">' + msg + '</p><p style="font-size:12px;color:#64748b;margin-top:20px;">Dacă rulați fișierul prin dublu-click (file://), asigurați-vă că aveți conexiune la internet pentru descărcarea librăriilor (React, Tailwind).<br><br>Linia: ' + line + '</p></div>'; 
            }
        };
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Playfair Display for Mandachi Luxury Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- React & ReactDOM UMD -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        gold: {
                            100: '#FDF8E1',
                            300: '#F3E5AB',
                            400: '#E5C158',
                            500: '#D4AF37',
                            600: '#C5A059',
                            700: '#AA7C11',
                            900: '#5C4100'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080c14; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.82); border: 1px solid rgba(148, 163, 184, 0.12); backdrop-filter: blur(12px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    
    <div id="root">
        <!-- Initial Loading State -->
        <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
            <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <h1 class="text-amber-400 font-serif text-xl tracking-widest uppercase">Mandachi Hotel & Spa</h1>
            <p class="text-slate-500 text-sm mt-2">Inițializare sistem de gestiune...</p>
        </div>
    </div>

    <!-- MAIN APP SCRIPT -->
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, Component } = React;

        // --- 1. ROBUST ICONS (Lucide SVGs embedded to prevent script errors) ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                layoutDashboard: <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>,
                calendar: <path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>,
                calculator: <path d="M16 16h.01M16 12h.01M12 16h.01M12 12h.01M8 16h.01M8 12h.01M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM4 8h16"/>,
                history: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M12 7v5l4 2"/>,
                plus: <path d="M12 5v14M5 12h14"/>,
                edit: <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>,
                trash: <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>,
                check: <path d="M20 6 9 17l-5-5"/>,
                logOut: <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>,
                table: <path d="M12 3v18M3 9h18M3 15h18M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>,
                smartphone: <path d="M5 2h14a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM12 18h.01"/>,
                user: <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>,
                x: <path d="M18 6 6 18M6 6l12 12"/>,
                search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></>
            };
            return (
                <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    {icons[name] || icons.check}
                </svg>
            );
        };

        // --- 2. ROBUST ERROR BOUNDARY ---
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("React Error Caught:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                            <div className="glass-panel p-8 rounded-2xl max-w-lg text-center space-y-4 shadow-2xl">
                                <Icon name="x" className="w-12 h-12 text-rose-500 mx-auto" />
                                <h2 className="text-xl font-bold text-white">Eroare de Sistem</h2>
                                <p className="text-sm text-slate-400">{this.state.error?.toString() || 'O componentă a eșuat la încărcare.'}</p>
                                <button 
                                    onClick={() => { localStorage.clear(); window.location.reload(); }}
                                    className="px-6 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition-colors"
                                >
                                    Resetează Datele & Reîncarcă
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- 3. DATA & CONSTANTS ---
        const USERS = [
            { id: 'daniel', name: 'Daniel', role: 'Super Admin', pass: 'daniel2026', canClearAudit: true },
            { id: 'anisoara', name: 'Anișoara', role: 'Șef General', pass: 'anisoara123', canClearAudit: false },
            { id: 'anca', name: 'Anca', role: 'Șef Vânzări', pass: 'anca123', canClearAudit: false },
            { id: 'nicoleta', name: 'Nicoleta', role: 'Șef Nunți', pass: 'nicoleta123', canClearAudit: false },
            { id: 'elena', name: 'Elena', role: 'Asistent Contabilitate', pass: 'elena123', canClearAudit: false }
        ];

        const INITIAL_EVENTS = [
            { id: '1', contractNo: 'CTR-101', clientName: 'Ion & Maria', date: '2026-05-15', type: 'Nuntă', hall: 'Magnifique', adultGuests: 150, kidGuests: 10, adultPrice: 400, kidPrice: 200, advancePaid: 20000, foodCost: 18000, staffCost: 5000, otherCost: 2000 },
            { id: '2', contractNo: 'CTR-102', clientName: 'Firma IT SRL', date: '2026-06-20', type: 'Corporate', hall: 'Cristal', adultGuests: 300, kidGuests: 0, adultPrice: 350, kidPrice: 0, advancePaid: 50000, foodCost: 35000, staffCost: 8000, otherCost: 5000 }
        ];

        const formatMoney = (val) => new Intl.NumberFormat('ro-RO', { style: 'currency', currency: 'RON', maximumFractionDigits: 0 }).format(val || 0);

        const calculateMetrics = (evt) => {
            const grossIncome = (evt.adultGuests * evt.adultPrice) + (evt.kidGuests * evt.kidPrice);
            const netIncome = grossIncome / 1.19; // 19% TVA scos
            const totalCosts = evt.foodCost + evt.staffCost + evt.otherCost;
            const netProfit = netIncome - totalCosts;
            const remaining = grossIncome - evt.advancePaid;
            
            return { grossIncome, netIncome, totalCosts, netProfit, remaining, totalGuests: evt.adultGuests + evt.kidGuests };
        };

        // --- 4. MAIN APP LOGIC ---
        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [events, setEvents] = useState(() => {
                try { return JSON.parse(localStorage.getItem('mandachi_events')) || INITIAL_EVENTS; } catch { return INITIAL_EVENTS; }
            });
            const [auditLogs, setAuditLogs] = useState(() => {
                try { return JSON.parse(localStorage.getItem('mandachi_audit')) || []; } catch { return []; }
            });
            const [activeTab, setActiveTab] = useState('events');

            // Persist Data
            useEffect(() => { localStorage.setItem('mandachi_events', JSON.stringify(events)); }, [events]);
            useEffect(() => { localStorage.setItem('mandachi_audit', JSON.stringify(auditLogs)); }, [auditLogs]);

            const logAction = (action, ref, details) => {
                const newLog = {
                    id: Date.now().toString(),
                    date: new Date().toLocaleString('ro-RO'),
                    user: currentUser.name,
                    role: currentUser.role,
                    action,
                    ref,
                    details
                };
                setAuditLogs(prev => [newLog, ...prev]);
            };

            const handleClearLogs = () => {
                if (currentUser.canClearAudit && window.confirm("Ești sigur că vrei să ștergi TOT istoricul?")) {
                    setAuditLogs([]);
                }
            };

            if (!currentUser) return <LoginScreen onLogin={setCurrentUser} />;

            return (
                <div className="min-h-screen flex flex-col">
                    {/* TOPBAR */}
                    <header className="glass-panel sticky top-0 z-40 border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded bg-amber-500 text-slate-950 flex items-center justify-center font-serif font-bold text-xl">M</div>
                                <div className="hidden sm:block">
                                    <h1 class="text-amber-400 font-bold text-sm tracking-wide">MANDACHI HOTEL & SPA</h1>
                                    <p class="text-slate-400 text-[10px] uppercase">Gestiune Evenimente</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-right hidden sm:block">
                                    <p className="text-sm font-bold text-white">{currentUser.name}</p>
                                    <p className="text-xs text-amber-500">{currentUser.role}</p>
                                </div>
                                <button onClick={() => setCurrentUser(null)} className="p-2 rounded-lg bg-slate-800 hover:bg-rose-900 text-slate-300 transition-colors" title="Deconectare">
                                    <Icon name="logOut" />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* TABS */}
                    <div className="bg-slate-900 border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto no-scrollbar">
                            {[
                                { id: 'dashboard', icon: 'layoutDashboard', label: 'Dashboard' },
                                { id: 'events', icon: 'calendar', label: 'Evenimente' },
                                { id: 'audit', icon: 'history', label: 'Istoric Modificări' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-4 py-3 text-sm font-semibold border-b-2 whitespace-nowrap transition-colors ${activeTab === tab.id ? 'border-amber-500 text-amber-400 bg-amber-500/10' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                                >
                                    <Icon name={tab.icon} className="w-4 h-4" />
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* CONTENT */}
                    <main className="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6">
                        {activeTab === 'dashboard' && <DashboardView events={events} />}
                        {activeTab === 'events' && <EventsView events={events} setEvents={setEvents} logAction={logAction} />}
                        {activeTab === 'audit' && <AuditView logs={auditLogs} onClear={handleClearLogs} canClear={currentUser.canClearAudit} />}
                    </main>
                </div>
            );
        }

        // --- 5. SUB-VIEWS ---
        function LoginScreen({ onLogin }) {
            const [selectedId, setSelectedId] = useState(USERS[0].id);
            const [pass, setPass] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const user = USERS.find(u => u.id === selectedId);
                if (user && user.pass === pass) {
                    onLogin(user);
                } else {
                    setError('Parolă incorectă!');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <form onSubmit={handleSubmit} className="glass-panel p-6 sm:p-8 rounded-2xl w-full max-w-md shadow-2xl">
                        <div className="text-center mb-6">
                            <div className="w-16 h-16 rounded-full bg-amber-500/20 text-amber-500 flex items-center justify-center font-serif font-bold text-4xl mx-auto mb-4 border border-amber-500/30">M</div>
                            <h2 className="text-xl font-bold text-white">Autentificare Sistem</h2>
                        </div>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-400 mb-1">Utilizator</label>
                                <select 
                                    value={selectedId} 
                                    onChange={(e) => { setSelectedId(e.target.value); setError(''); setPass(''); }}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-amber-500"
                                >
                                    {USERS.map(u => <option key={u.id} value={u.id}>{u.name} ({u.role})</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-400 mb-1">Parolă</label>
                                <input 
                                    type="password" required value={pass} onChange={e => setPass(e.target.value)}
                                    placeholder="Introduceți parola..."
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-amber-500"
                                />
                            </div>
                            {error && <p className="text-rose-500 text-xs font-semibold text-center">{error}</p>}
                            <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition-colors">
                                Autentificare
                            </button>
                        </div>
                        
                        <div className="mt-6 pt-4 border-t border-slate-800 text-center">
                            <p className="text-xs text-slate-500 mb-2">Ghid Demo (Parole):</p>
                            <div className="flex flex-wrap gap-2 justify-center text-[10px]">
                                {USERS.map(u => (
                                    <span key={u.id} onClick={() => {setSelectedId(u.id); setPass(u.pass);}} className="cursor-pointer bg-slate-800 px-2 py-1 rounded text-slate-400 hover:text-amber-400">
                                        {u.name}: {u.pass}
                                    </span>
                                ))}
                            </div>
                        </div>
                    </form>
                </div>
            );
        }

        function DashboardView({ events }) {
            const chartRef = useRef(null);
            
            const totals = useMemo(() => {
                return events.reduce((acc, ev) => {
                    const m = calculateMetrics(ev);
                    acc.gross += m.grossIncome;
                    acc.netProfit += m.netProfit;
                    acc.costs += m.totalCosts;
                    return acc;
                }, { gross: 0, netProfit: 0, costs: 0 });
            }, [events]);

            useEffect(() => {
                if (!chartRef.current || typeof Chart === 'undefined') return;
                const ctx = chartRef.current.getContext('2d');
                const myChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: events.map(e => e.contractNo),
                        datasets: [
                            { label: 'Profit Net', data: events.map(e => calculateMetrics(e).netProfit), backgroundColor: '#10b981' },
                            { label: 'Costuri', data: events.map(e => calculateMetrics(e).totalCosts), backgroundColor: '#f43f5e' }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, color: '#94a3b8' }
                });
                return () => myChart.destroy();
            }, [events]);

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="glass-panel p-5 rounded-2xl">
                            <p className="text-xs text-slate-400 uppercase font-semibold">Total Venit Brut</p>
                            <h3 className="text-2xl font-bold text-white mt-1">{formatMoney(totals.gross)}</h3>
                        </div>
                        <div className="glass-panel p-5 rounded-2xl">
                            <p className="text-xs text-slate-400 uppercase font-semibold">Costuri Operaționale</p>
                            <h3 className="text-2xl font-bold text-rose-400 mt-1">{formatMoney(totals.costs)}</h3>
                        </div>
                        <div className="glass-panel p-5 rounded-2xl">
                            <p className="text-xs text-slate-400 uppercase font-semibold">Total Profit Net</p>
                            <h3 className="text-2xl font-bold text-emerald-400 mt-1">{formatMoney(totals.netProfit)}</h3>
                        </div>
                    </div>
                    <div className="glass-panel p-5 rounded-2xl h-80">
                        <h3 className="text-sm font-bold text-white mb-4">Analiză per Contract</h3>
                        <div className="h-64 w-full"><canvas ref={chartRef}></canvas></div>
                    </div>
                </div>
            );
        }

        function EventsView({ events, setEvents, logAction }) {
            const [viewMode, setViewMode] = useState('table');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingEvent, setEditingEvent] = useState(null);

            const handleSave = (eventData) => {
                if (eventData.id) {
                    const old = events.find(e => e.id === eventData.id);
                    let changes = [];
                    Object.keys(eventData).forEach(key => {
                        if (String(old[key]) !== String(eventData[key])) changes.push(`${key}: ${old[key]} -> ${eventData[key]}`);
                    });
                    setEvents(events.map(e => e.id === eventData.id ? eventData : e));
                    logAction('EDIT', eventData.contractNo, changes.join(' | '));
                } else {
                    const newEvt = { ...eventData, id: Date.now().toString() };
                    setEvents([newEvt, ...events]);
                    logAction('ADD', newEvt.contractNo, `Creat eveniment pt. ${newEvt.clientName}`);
                }
                setIsModalOpen(false);
            };

            const handleDelete = (id, contractNo) => {
                if(window.confirm("Ștergi acest contract definitiv?")) {
                    setEvents(events.filter(e => e.id !== id));
                    logAction('DELETE', contractNo, 'Eveniment șters.');
                }
            };

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
                        <div className="flex bg-slate-950 rounded-lg p-1 border border-slate-800">
                            <button onClick={() => setViewMode('table')} className={`p-2 rounded ${viewMode === 'table' ? 'bg-amber-500 text-slate-900' : 'text-slate-400'}`}><Icon name="table" className="w-4 h-4" /></button>
                            <button onClick={() => setViewMode('cards')} className={`p-2 rounded ${viewMode === 'cards' ? 'bg-amber-500 text-slate-900' : 'text-slate-400'}`}><Icon name="smartphone" className="w-4 h-4" /></button>
                        </div>
                        <button onClick={() => { setEditingEvent(null); setIsModalOpen(true); }} className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg flex items-center gap-2">
                            <Icon name="plus" className="w-4 h-4" /> Adaugă
                        </button>
                    </div>

                    {viewMode === 'table' ? (
                        <div className="glass-panel rounded-2xl overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-950 text-slate-400">
                                    <tr>
                                        <th className="p-4 font-semibold">Contract / Client</th>
                                        <th className="p-4 font-semibold">Dată / Sală</th>
                                        <th className="p-4 font-semibold text-right">Venit Brut</th>
                                        <th className="p-4 font-semibold text-right">Costuri</th>
                                        <th className="p-4 font-semibold text-right">Profit Net</th>
                                        <th className="p-4 font-semibold text-center">Acțiuni</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    {events.map(ev => {
                                        const m = calculateMetrics(ev);
                                        return (
                                            <tr key={ev.id} className="hover:bg-slate-800/50">
                                                <td className="p-4"><p className="font-bold text-amber-400">{ev.contractNo}</p><p className="text-xs text-white">{ev.clientName}</p></td>
                                                <td className="p-4"><p className="text-slate-200">{ev.date}</p><p className="text-xs text-slate-400">{ev.hall}</p></td>
                                                <td className="p-4 text-right font-semibold text-white">{formatMoney(m.grossIncome)}</td>
                                                <td className="p-4 text-right text-rose-400">{formatMoney(m.totalCosts)}</td>
                                                <td className="p-4 text-right font-bold text-emerald-400">{formatMoney(m.netProfit)}</td>
                                                <td className="p-4">
                                                    <div className="flex justify-center gap-2">
                                                        <button onClick={() => { setEditingEvent(ev); setIsModalOpen(true); }} className="p-2 text-amber-400 hover:bg-slate-800 rounded"><Icon name="edit" className="w-4 h-4"/></button>
                                                        <button onClick={() => handleDelete(ev.id, ev.contractNo)} className="p-2 text-rose-400 hover:bg-slate-800 rounded"><Icon name="trash" className="w-4 h-4"/></button>
                                                    </div>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            {events.map(ev => {
                                const m = calculateMetrics(ev);
                                return (
                                    <div key={ev.id} className="glass-panel p-4 rounded-xl space-y-3">
                                        <div className="flex justify-between items-start border-b border-slate-800 pb-2">
                                            <div>
                                                <span className="text-xs font-bold text-amber-400">{ev.contractNo}</span>
                                                <h3 className="font-bold text-white">{ev.clientName}</h3>
                                            </div>
                                            <div className="flex gap-1">
                                                <button onClick={() => { setEditingEvent(ev); setIsModalOpen(true); }} className="p-2 text-amber-400 bg-slate-900 rounded"><Icon name="edit" className="w-4 h-4"/></button>
                                                <button onClick={() => handleDelete(ev.id, ev.contractNo)} className="p-2 text-rose-400 bg-slate-900 rounded"><Icon name="trash" className="w-4 h-4"/></button>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 text-xs">
                                            <div className="bg-slate-950 p-2 rounded">
                                                <p className="text-slate-400">Venit Brut</p>
                                                <p className="font-bold text-white">{formatMoney(m.grossIncome)}</p>
                                            </div>
                                            <div className="bg-slate-950 p-2 rounded">
                                                <p className="text-slate-400">Profit Net</p>
                                                <p className="font-bold text-emerald-400">{formatMoney(m.netProfit)}</p>
                                            </div>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    )}
                    {isModalOpen && <EventModal event={editingEvent} onClose={() => setIsModalOpen(false)} onSave={handleSave} />}
                </div>
            );
        }

        function EventModal({ event, onClose, onSave }) {
            const [form, setForm] = useState(event || {
                clientName: '', contractNo: 'CTR-', date: '', type: 'Nuntă', hall: 'Magnifique',
                adultGuests: 0, kidGuests: 0, adultPrice: 0, kidPrice: 0,
                advancePaid: 0, foodCost: 0, staffCost: 0, otherCost: 0
            });

            const handleChange = (e) => {
                const { name, value, type } = e.target;
                setForm(prev => ({ ...prev, [name]: type === 'number' ? Number(value) : value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave(form);
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-slate-900 border border-amber-500/30 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto flex flex-col shadow-2xl">
                        <div className="p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 bg-slate-900 z-10">
                            <h3 className="font-bold text-white text-lg">{event ? 'Editează Contract' : 'Eveniment Nou'}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white"><Icon name="x" /></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-6">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label className="block text-xs text-slate-400 mb-1">Contract</label><input required name="contractNo" value={form.contractNo} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white" /></div>
                                <div><label className="block text-xs text-slate-400 mb-1">Client</label><input required name="clientName" value={form.clientName} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white" /></div>
                                <div><label className="block text-xs text-slate-400 mb-1">Dată</label><input required type="date" name="date" value={form.date} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white" /></div>
                                <div><label className="block text-xs text-slate-400 mb-1">Sală</label><input required name="hall" value={form.hall} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white" /></div>
                            </div>
                            
                            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 grid grid-cols-2 gap-4">
                                <div><label className="block text-xs text-slate-400 mb-1">Adulți</label><input type="number" name="adultGuests" value={form.adultGuests} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white" /></div>
                                <div><label className="block text-xs text-slate-400 mb-1">Preț Meniu Adult</label><input type="number" name="adultPrice" value={form.adultPrice} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white" /></div>
                                <div><label className="block text-xs text-slate-400 mb-1">Copii</label><input type="number" name="kidGuests" value={form.kidGuests} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white" /></div>
                                <div><label className="block text-xs text-slate-400 mb-1">Preț Meniu Copil</label><input type="number" name="kidPrice" value={form.kidPrice} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white" /></div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div><label className="block text-xs text-slate-400 mb-1">Food Cost</label><input type="number" name="foodCost" value={form.foodCost} onChange={handleChange} className="w-full bg-slate-950 border border-rose-900/50 rounded-lg p-2 text-sm text-white" /></div>
                                <div><label className="block text-xs text-slate-400 mb-1">Cost Personal</label><input type="number" name="staffCost" value={form.staffCost} onChange={handleChange} className="w-full bg-slate-950 border border-rose-900/50 rounded-lg p-2 text-sm text-white" /></div>
                                <div><label className="block text-xs text-slate-400 mb-1">Alte Costuri</label><input type="number" name="otherCost" value={form.otherCost} onChange={handleChange} className="w-full bg-slate-950 border border-rose-900/50 rounded-lg p-2 text-sm text-white" /></div>
                            </div>

                            <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-slate-300 bg-slate-800 rounded-lg">Anulare</button>
                                <button type="submit" className="px-6 py-2 bg-amber-500 text-slate-950 font-bold rounded-lg shadow-lg">Salvează</button>
                            </div>
                        </form>
                    </div>
                </div>
            )
        }

        function AuditView({ logs, onClear, canClear }) {
            return (
                <div className="glass-panel p-4 sm:p-6 rounded-2xl space-y-4">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                        <h2 className="text-lg font-bold text-white flex items-center gap-2"><Icon name="history" /> Istoric Sistem</h2>
                        {canClear && <button onClick={onClear} className="px-3 py-1.5 bg-rose-900/40 text-rose-400 text-xs font-bold rounded border border-rose-800 hover:bg-rose-900 transition">Curăță Jurnal</button>}
                    </div>
                    <div className="space-y-3">
                        {logs.length === 0 ? <p className="text-slate-500 text-sm">Nu există modificări recente.</p> : null}
                        {logs.map(log => (
                            <div key={log.id} className="bg-slate-950 border border-slate-800 p-3 rounded-lg flex flex-col sm:flex-row gap-3 justify-between items-start sm:items-center">
                                <div>
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${log.action === 'ADD' ? 'border-emerald-500 text-emerald-400 bg-emerald-500/10' : log.action === 'DELETE' ? 'border-rose-500 text-rose-400 bg-rose-500/10' : 'border-blue-500 text-blue-400 bg-blue-500/10'}`}>{log.action}</span>
                                        <span className="text-white font-semibold text-sm">{log.ref}</span>
                                    </div>
                                    <p className="text-xs text-slate-400">{log.details}</p>
                                </div>
                                <div className="text-right text-xs">
                                    <p className="text-amber-400 font-semibold">{log.user}</p>
                                    <p className="text-slate-500">{log.date}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
