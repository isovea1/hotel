<script type="text/babel">
const{useEffect,useMemo,useRef,useState}=React;
const DOMAIN='@hotelmandachi.com';
const USERS={['daniel'+DOMAIN]:{name:'Daniel',role:'Administrator',canEdit:true,isAdmin:true},['anca'+DOMAIN]:{name:'Anca',role:'Editor',canEdit:true},['nicoleta'+DOMAIN]:{name:'Nicoleta',role:'Editor',canEdit:true},['anisoara'+DOMAIN]:{name:'Anișoara',role:'Doar vizualizare',canEdit:false}};
const INITIAL=[
{id:'1',eventDate:'2026-05-15',eventType:'Nuntă',hall:'Magnifique',clientName:'Ion & Maria',contractNo:'CTR-101',contractDate:'',advancePaid:20000,contractedPeople:160,includedServices:'',menuType:'',adultMenuPrice:400,childMenuPrice:200,confirmedAdults:150,confirmedChildren:10,servedAdultMenus:150,servedChildMenus:10,beveragesValue:0,amountCollected:0,foodCost:25000,employeeCount:0,employeeNetCost:8000,dayWorkerCount:0,dayWorkerNetCost:0,grossTotalStaffCost:8000,includedServicesCost:5000},
{id:'2',eventDate:'2026-06-20',eventType:'Corporate',hall:'Cristal',clientName:'Firma IT SRL',contractNo:'CTR-102',contractDate:'',advancePaid:30000,contractedPeople:300,includedServices:'',menuType:'',adultMenuPrice:350,childMenuPrice:0,confirmedAdults:300,confirmedChildren:0,servedAdultMenus:300,servedChildMenus:0,beveragesValue:0,amountCollected:0,foodCost:45000,employeeCount:0,employeeNetCost:12000,dayWorkerCount:0,dayWorkerNetCost:0,grossTotalStaffCost:12000,includedServicesCost:8000}];
const num=v=>Number(v)||0,money=v=>new Intl.NumberFormat('ro-RO',{style:'currency',currency:'RON',maximumFractionDigits:0}).format(num(v));
const pct=v=>(Number(v)||0).toFixed(1)+'%';

function normalize(e){return{...e,eventDate:e.eventDate||e.date||'',eventType:e.eventType||e.type||'',clientName:e.clientName||'',hall:e.hall||'',contractNo:e.contractNo||'',contractDate:e.contractDate||'',advancePaid:num(e.advancePaid),contractedPeople:num(e.contractedPeople)||num(e.adultGuests)+num(e.kidGuests),includedServices:e.includedServices||'',menuType:e.menuType||'',adultMenuPrice:num(e.adultMenuPrice)||num(e.adultPrice),childMenuPrice:num(e.childMenuPrice)||num(e.kidPrice),confirmedAdults:num(e.confirmedAdults)||num(e.adultGuests),confirmedChildren:num(e.confirmedChildren)||num(e.kidGuests),servedAdultMenus:num(e.servedAdultMenus)||num(e.adultGuests),servedChildMenus:num(e.servedChildMenus)||num(e.kidGuests),beveragesValue:num(e.beveragesValue),amountCollected:num(e.amountCollected),foodCost:num(e.foodCost),employeeCount:num(e.employeeCount),employeeNetCost:num(e.employeeNetCost)||num(e.staffCost),dayWorkerCount:num(e.dayWorkerCount),dayWorkerNetCost:num(e.dayWorkerNetCost),grossTotalStaffCost:num(e.grossTotalStaffCost)||num(e.staffCost),includedServicesCost:num(e.includedServicesCost)||num(e.otherCost)}}

function calc(e){
  const menuValue=num(e.servedAdultMenus)*num(e.adultMenuPrice)+num(e.servedChildMenus)*num(e.childMenuPrice);
  const totalEventValue=menuValue+num(e.beveragesValue);
  const netRevenue=totalEventValue/1.19;
  const totalEventCost=num(e.foodCost)+num(e.grossTotalStaffCost)+num(e.includedServicesCost);
  const profit=netRevenue-totalEventCost;
  const foodCostPercent=totalEventValue>0?(num(e.foodCost)/totalEventValue)*100:0;
  const profitPercent=netRevenue>0?(profit/netRevenue)*100:0;
  return{menuValue,totalEventValue,netRevenue,totalEventCost,profit,foodCostPercent,profitPercent};
}

const columns=[['eventDate','Dată eveniment','date'],['eventType','Tip eveniment'],['hall','Sală eveniment'],['clientName','Nume și prenume'],['contractNo','Nr. contract'],['contractDate','Dată contract','date'],['advancePaid','Avans achitat (lei)','number'],['contractedPeople','Nr. persoane contractate','number'],['includedServices','Alte servicii incluse în preț','textarea'],['menuType','Tip meniu negociat'],['adultMenuPrice','Preț meniu adulți (lei)','number'],['childMenuPrice','Preț meniu copii (lei)','number'],['confirmedAdults','Nr. adulți confirmați','number'],['confirmedChildren','Nr. copii confirmați','number'],['servedAdultMenus','Nr. meniuri servite (adulți)','number'],['servedChildMenus','Nr. meniuri servite (copii)','number'],['beveragesValue','Valoare băuturi (lei)','number'],['amountCollected','Valoare încasată (lei)','number'],['foodCost','Food cost (lei), bucătărie + bar','number'],['employeeCount','Nr. personal angajat','number'],['employeeNetCost','Cost NET personal angajat (lei)','number'],['dayWorkerCount','Nr. zilieri','number'],['dayWorkerNetCost','Cost NET zilieri (lei)','number'],['grossTotalStaffCost','Cost BRUT total personal (lei)','number'],['includedServicesCost','Cost alte servicii incluse (lei)','number']];

const allColumns=[['serial','Nr. crt.'],...columns.slice(0,6),...columns.slice(6),['menuValue','Valoare meniuri (lei)'],['totalEventValue','Valoare totală eveniment (lei), TVA inclus'],['netRevenue','Venit net (lei)'],['foodCostPercent','Food Cost (%)'],['totalEventCost','Cost total eveniment (lei)'],['profit','Profit (lei)'],['profitPercent','Profit (%)']];

const groups=[{title:'Eveniment și contract',keys:['eventDate','eventType','hall','clientName','contractNo','contractDate']},{title:'Contract și meniu',keys:['advancePaid','contractedPeople','includedServices','menuType','adultMenuPrice','childMenuPrice']},{title:'Confirmări și meniuri servite',keys:['confirmedAdults','confirmedChildren','servedAdultMenus','servedChildMenus']},{title:'Încasări și venituri',keys:['menuValue','beveragesValue','totalEventValue','amountCollected','netRevenue']},{title:'Costuri, profit și procente',keys:['foodCost','foodCostPercent','employeeCount','employeeNetCost','dayWorkerCount','dayWorkerNetCost','grossTotalStaffCost','includedServicesCost','totalEventCost','profit','profitPercent']}];

function displayValue(e,key,index){
  const m=calc(e);
  if(key==='serial')return index+1;
  if(key==='menuValue')return money(m.menuValue);
  if(key==='totalEventValue')return money(m.totalEventValue);
  if(key==='netRevenue')return money(m.netRevenue);
  if(key==='totalEventCost')return money(m.totalEventCost);
  if(key==='profit')return money(m.profit);
  if(key==='foodCostPercent')return pct(m.foodCostPercent);
  if(key==='profitPercent')return pct(m.profitPercent);
  if(key==='contract')return`${e.contractNo||'—'}${e.contractDate?' · '+e.contractDate:''}`;
  if(['advancePaid','adultMenuPrice','childMenuPrice','beveragesValue','amountCollected','foodCost','employeeNetCost','dayWorkerNetCost','grossTotalStaffCost','includedServicesCost'].includes(key))return money(e[key]);
  return e[key]??'—';
}

const fold=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function App(){
 const[user,setUser]=useState(null),[authReady,setAuthReady]=useState(false),[events,setEvents]=useState([]),[logs,setLogs]=useState([]),[status,setStatus]=useState('Autentifică-te pentru a continua.'),[error,setError]=useState(''),[tab,setTab]=useState('events'),[modal,setModal]=useState(null),[search,setSearch]=useState('');const seedStarted=useRef(false);const profile=user?USERS[(user.email||'').toLowerCase()]:null;
 useEffect(()=>auth.onAuthStateChanged(u=>{setUser(u?.isAnonymous?null:u);setAuthReady(true)}),[]);
 useEffect(()=>{if(!user||!profile){setEvents([]);setLogs([]);return}setStatus('Se sincronizează cu baza de date…');const onEvents=s=>{const data=s.val();if(data){setEvents(Object.entries(data).map(([id,e])=>normalize({...e,id})).sort((a,b)=>(a.eventDate||'').localeCompare(b.eventDate||'')));setStatus('Online · sincronizare în timp real')}else if(!seedStarted.current&&profile.canEdit){seedStarted.current=true;const seed={};INITIAL.forEach(({id,...e})=>seed[id]=e);eventsRef.update(seed).catch(err=>setError('Nu s-au putut inițializa evenimentele. '+err.message))}else{setEvents([]);setStatus('Online · nu există evenimente încă')}};const onErr=e=>{setStatus('Eroare de sincronizare');setError('Acces la evenimente eșuat. Verifică regulile Realtime Database. '+e.message)};const onLogs=s=>{const d=s.val()||{};setLogs(Object.entries(d).map(([id,x])=>({id,...x})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,200))};eventsRef.on('value',onEvents,onErr);auditRef.on('value',onLogs,e=>setError('Istoric inaccesibil: '+e.message));return()=>{eventsRef.off('value',onEvents);auditRef.off('value',onLogs)}},[user,profile?.role,profile?.canEdit]);
 const signIn=async e=>{e.preventDefault();setError('');const u=e.currentTarget.username.value.trim().toLowerCase().replace(/@hotelmandachi\.com$/i,'');if(!/^[a-z0-9._-]+$/.test(u)){setError('Introdu un nume de utilizator valid.');return}if(!USERS[u+DOMAIN]){setError('Acest utilizator nu are acces.');return}try{await auth.signInWithEmailAndPassword(u+DOMAIN,e.currentTarget.password.value)}catch(err){setError('Autentificarea nu a reușit. Verifică utilizatorul și parola Firebase.')}};
 const record=(action,ref,details)=>auditRef.push({action,ref,details,user:profile.name,role:profile.role,uid:user.uid,createdAt:firebase.database.ServerValue.TIMESTAMP});
 const save=async data=>{if(!profile?.canEdit)return;try{const{id,...fields}=data;if(id){await eventsRef.child(id).update(fields);await record('EDIT',data.contractNo,'Eveniment actualizat')}else{const ref=eventsRef.push();await ref.set(fields);await record('ADD',data.contractNo,`Creat eveniment pentru ${data.clientName}`)}setModal(null);setError('')}catch(e){setError('Salvarea a eșuat. '+e.message)}};
 const remove=async e=>{if(!profile?.canEdit||!confirm(`Ștergi evenimentul ${e.contractNo}?`))return;try{await eventsRef.child(e.id).remove();await record('DELETE',e.contractNo,'Eveniment șters')}catch(err){setError('Ștergerea a eșuat: '+err.message)}};
 const clearLogs=async()=>{if(profile?.isAdmin&&confirm('Ștergi istoricul?'))try{await auditRef.remove()}catch(e){setError(e.message)}};
 const filteredEvents=useMemo(()=>{const q=fold(search.trim());if(!q)return events;return events.filter(e=>fold(e.clientName).includes(q)||fold(e.contractNo).includes(q))},[events,search]);

   },{value:0,cost:0,profit:0,foodCost:0});
 },[events]);

 const avgFoodCostPct = totals.value > 0 ? (totals.foodCost / totals.value) * 100 : 0;
 const avgProfitPct = (totals.value/1.19) > 0 ? (totals.profit / (totals.value/1.19)) * 100 : 0;

 if(!authReady||!user)return <Login onSubmit={signIn} error={error} status={status}/>;if(!profile)return <div className="min-h-screen grid place-items-center p-5"><div className="panel rounded-2xl p-6 text-center">Cont neautorizat<button onClick={()=>auth.signOut()} className="ml-3 text-amber-300">Ieșire</button></div></div>;
 const fieldValue=(e,k,i)=>k==='serial'?i+1:displayValue(e,k,i);
 return <div className="min-h-screen bg-[radial-gradient(ellipse_at_top,_rgba(30,41,59,.4),_transparent_55%)]">
  <header className="panel sticky top-0 z-20 border-x-0 border-t-0"><div className="app-header-inner mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3"><div className="flex min-w-0 items-center gap-3"><img src="mandachi-logo.svg" alt="Mandachi Hotel & Spa" className="brand-logo h-12 w-auto"/><span className="hidden text-xs text-slate-400 sm:inline">Gestiune evenimente</span></div><div className="flex shrink-0 items-center gap-3"><span className="user-info text-right text-xs"><b className="block">{profile.name}</b><span className="text-slate-400">{profile.role}</span></span><button onClick={()=>auth.signOut()} className="rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-sm hover:bg-slate-700">Ieșire</button></div></div></header>

    <div className="mobile-view grid gap-3">{filteredEvents.map((event,index)=>{const m=calc(event);return <article key={event.id} className="mobile-event-card overflow-hidden rounded-2xl"><div className="border-b border-slate-700/70 bg-slate-900/50 p-4"><div className="flex items-start justify-between gap-3"><div className="min-w-0"><p className="text-[11px] font-semibold uppercase tracking-[.16em] text-amber-300">Eveniment {index+1} · {event.eventType||'Nespecificat'}</p><h2 className="mt-1 truncate text-lg font-bold text-white">{event.clientName||'Client nespecificat'}</h2><p className="mt-1 text-sm text-slate-400">{event.contractNo} {event.contractDate?`· ${event.contractDate}`:''}</p></div><div className="shrink-0 rounded-xl border border-emerald-500/20 bg-emerald-500/10 px-3 py-2 text-right"><p className="text-[10px] uppercase tracking-wide text-emerald-300">Profit ({pct(m.profitPercent)})</p><p className="font-bold text-emerald-200">{money(m.profit)}</p></div></div><div className="mt-3 flex flex-wrap gap-2 text-xs"><span className="rounded-full bg-slate-800 px-3 py-1.5 text-slate-300">{event.eventDate||'Fără dată'}</span><span className="rounded-full bg-slate-800 px-3 py-1.5 text-slate-300">{event.hall||'Fără sală'}</span><span className="rounded-full bg-slate-800 px-3 py-1.5 text-slate-300">Food Cost: {pct(m.foodCostPercent)}</span></div></div><div className="grid grid-cols-2 gap-2 p-3"><div className="rounded-xl bg-slate-950/70 p-3"><p className="text-xs text-slate-400">Valoare eveniment</p><p className="mt-1 font-semibold">{money(m.totalEventValue)}</p></div><div className="rounded-xl bg-slate-950/70 p-3"><p className="text-xs text-slate-400">Valoare încasată</p><p className="mt-1 font-semibold">{money(event.amountCollected)}</p></div></div><div className="space-y-2 px-4 pb-4">{groups.map(group=><details key={group.title} className="mobile-group rounded-xl border border-slate-700/70 bg-slate-950/35" open={group.title==='Eveniment și contract'}><summary className="flex items-center justify-between px-3 py-3 text-sm font-semibold text-slate-200">{group.title}<span className="text-amber-300">＋</span></summary><div className="px-3 pb-2">{group.keys.map(key=><div key={key} className="mobile-data-row"><span className="mobile-data-label">{columnLabels[key]||key}</span><span className="mobile-data-value">{fieldValue(event,key,index)}</span></div>)}</div></details>)}</div>{profile.canEdit&&<div className="flex gap-2 border-t border-slate-700/70 p-3"><button onClick={()=>setModal(event)} className="min-h-11 flex-1 rounded-xl border border-amber-500/30 bg-amber-500/10 font-semibold text-amber-200">Editează eveniment</button><button onClick={()=>remove(event)} className="min-h-11 rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 font-semibold text-rose-200">Șterge</button></div>}</article>})}{filteredEvents.length===0&&<div className="panel rounded-2xl p-6 text-center text-slate-400">{search?'Nu am găsit evenimente care să corespundă căutării.':'Nu există evenimente.'}</div>}</div>
    <div className="desktop-view panel rounded-2xl"><div className="flex items-center justify-between border-b border-slate-700 px-4 py-3"><div><h2 className="font-semibold text-white">Registru evenimente</h2><p className="text-xs text-slate-400">{filteredEvents.length} eveniment(e) {search?'găsite':'· derulează orizontal pentru toate detaliile'}</p></div><span className="rounded-full bg-slate-800 px-3 py-1 text-xs text-slate-300">Date live</span></div><div className="desktop-table-wrap"><table className="desktop-table text-left text-xs"><thead><tr>{allColumns.map(([key,label])=><th key={key} className="whitespace-nowrap px-3 py-3 font-semibold text-slate-300">{label}</th>)}{profile.canEdit&&<th className="px-3 py-3 text-slate-300">Acțiuni</th>}</tr></thead><tbody>{filteredEvents.map((event,index)=><tr key={event.id} className="hover:bg-slate-800/35">{allColumns.map(([key])=><td key={key} className="max-w-[260px] px-3 py-3 align-top text-slate-200">{fieldValue(event,key,index)}</td>)}{profile.canEdit&&<td className="whitespace-nowrap px-3 py-3"><button onClick={()=>setModal(event)} className="mr-3 text-amber-300">Editează</button><button onClick={()=>remove(event)} className="text-rose-300">Șterge</button></td>}</tr>)}</tbody></table>{filteredEvents.length===0&&<p className="p-6 text-center text-slate-400">{search?'Nu am găsit evenimente care să corespundă căutării.':'Nu există evenimente.'}</p>}</div></div>
   </section>}
   {tab==='audit'&&<section className="space-y-3">{profile.isAdmin&&logs.length>0&&<button onClick={clearLogs} className="min-h-10 rounded-lg bg-rose-900 px-4 py-2 text-sm text-rose-100">Șterge istoricul</button>}{logs.map(log=><article key={log.id} className="panel flex flex-wrap justify-between gap-2 rounded-xl p-4"><div><b className="text-amber-300">{log.action} · {log.ref}</b><p className="mt-1 text-sm text-slate-400">{log.details}</p></div><span className="text-xs text-slate-500">{log.user}</span></article>)}{logs.length===0&&<p className="text-slate-400">Istoricul se va afișa aici.</p>}</section>}
  </main>{modal&&profile.canEdit&&<EventForm initial={modal} close={()=>setModal(null)} save={save}/>}
 </div>;
}
const columnLabels=Object.fromEntries([...columns.map(([key,label])=>[key,label]),['serial','Nr. crt.'],['contract','Nr. / dată contract'],['foodCostPercent','Food Cost (%)'],['profitPercent','Profit (%)']]);
function Login({onSubmit,error,status}){return <div className="min-h-[100svh] flex items-center justify-center p-4"><form onSubmit={onSubmit} className="panel w-full max-w-md space-y-5 rounded-2xl p-7 shadow-2xl"><img src="mandachi-logo.svg" alt="Mandachi Hotel & Spa" className="mx-auto w-48 max-w-full"/><h1 className="text-center text-xl font-bold">Autentificare</h1><p className="text-center text-xs text-slate-400">Introdu numele de utilizator și parola contului tău.</p><label className="block text-sm text-slate-300">Utilizator<input name="username" required autoComplete="username" placeholder="ex. daniel" className="mt-1 min-h-11 w-full rounded-lg border border-slate-700 bg-slate-950 p-3"/></label><label className="block text-sm text-slate-300">Parolă<input name="password" required type="password" autoComplete="current-password" className="mt-1 min-h-11 w-full rounded-lg border border-slate-700 bg-slate-950 p-3"/></label>{error&&<p role="alert" className="text-sm text-rose-300">{error}</p>}<button className="min-h-11 w-full rounded-lg bg-amber-400 py-3 font-bold text-slate-950">Intră în aplicație</button><p className="text-center text-xs text-slate-500">{status}</p></form></div>}
function EventForm({initial,close,save}){
 const defaults={eventDate:'',eventType:'',hall:'Magnifique',clientName:'',contractNo:'CTR-',contractDate:'',advancePaid:0,contractedPeople:0,includedServices:'',menuType:'',adultMenuPrice:0,childMenuPrice:0,confirmedAdults:0,confirmedChildren:0,servedAdultMenus:0,servedChildMenus:0,beveragesValue:0,amountCollected:0,foodCost:0,employeeCount:0,employeeNetCost:0,dayWorkerCount:0,dayWorkerNetCost:0,grossTotalStaffCost:0,includedServicesCost:0};const[form,setForm]=useState({...defaults,...initial});
 const fields=[['eventDate','Dată eveniment','date'],['eventType','Tip eveniment'],['hall','Sală eveniment'],['clientName','Nume și prenume'],['contractNo','Nr. contract'],['contractDate','Dată contract','date'],['advancePaid','Avans achitat (lei)','number'],['contractedPeople','Nr. persoane contractate','number'],['includedServices','Alte servicii incluse în preț','textarea'],['menuType','Tip meniu negociat'],['adultMenuPrice','Preț meniu adulți (lei)','number'],['childMenuPrice','Preț meniu copii (lei)','number'],['confirmedAdults','Nr. adulți confirmați','number'],['confirmedChildren','Nr. copii confirmați','number'],['servedAdultMenus','Nr. meniuri servite (adulți)','number'],['servedChildMenus','Nr. meniuri servite (copii)','number'],['beveragesValue','Valoare băuturi (lei)','number'],['amountCollected','Valoare încasată (lei)','number'],['foodCost','Food cost (lei), bucătărie + bar','number'],['employeeCount','Nr. personal angajat','number'],['employeeNetCost','Cost NET personal angajat (lei)','number'],['dayWorkerCount','Nr. zilieri','number'],['dayWorkerNetCost','Cost NET zilieri (lei)','number'],['grossTotalStaffCost','Cost BRUT total personal (lei)','number'],['includedServicesCost','Cost alte servicii incluse (lei)','number']];
 const preview=calc(form),update=(key,value)=>setForm(prev=>{const next={...prev,[key]:value};if(key==='employeeNetCost'||key==='dayWorkerNetCost')next.grossTotalStaffCost=num(key==='employeeNetCost'?value:prev.employeeNetCost)+num(key==='dayWorkerNetCost'?value:prev.dayWorkerNetCost);return next});
 return <div className="event-modal-backdrop fixed inset-0 z-30 flex items-center justify-center bg-slate-950/80 p-3 sm:p-6"><form onSubmit={e=>{e.preventDefault();save(form)}} className="event-modal panel max-h-[94vh] w-full max-w-4xl overflow-y-auto rounded-3xl shadow-2xl"><div className="sticky top-0 z-10 flex items-center justify-between gap-3 border-b border-slate-700 bg-slate-900/95 px-5 py-4 backdrop-blur"><div><p className="text-[10px] font-bold uppercase tracking-[.18em] text-amber-300">Mandachi Hotel &amp; Spa</p><h2 className="mt-1 text-lg font-bold">{initial.id?'Editează eveniment':'Înregistrare eveniment'}</h2></div><button type="button" onClick={close} className="min-h-10 min-w-10 rounded-xl bg-slate-800 text-slate-300" aria-label="Închide">✕</button></div><div className="space-y-6 p-5"><div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">{fields.map(([key,label,type='text'])=><label key={key} className="block text-xs font-medium leading-5 text-slate-300">{label}{type==='textarea'?<textarea value={form[key]??''} onChange={e=>update(key,e.target.value)} rows="2" className="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none focus:border-amber-400"/>:<input required={['eventDate','eventType','hall','clientName','contractNo'].includes(key)} type={type} min={type==='number'?0:undefined} value={form[key]??''} onChange={e=>update(key,type==='number'?num(e.target.value):e.target.value)} className="mt-1.5 min-h-11 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none focus:border-amber-400"/>}</label>)}</div><div className="grid grid-cols-2 gap-3 lg:grid-cols-3">{[['Valoare meniuri',money(preview.menuValue)],['Total eveniment · TVA',money(preview.totalEventValue)],['Venit net',money(preview.netRevenue)],['Food Cost (%)',pct(preview.foodCostPercent)],['Cost total operațional',money(preview.totalEventCost)],['Profit estimat',money(preview.profit) + ` (${pct(preview.profitPercent)})`]].map(([label,value])=><div key={label} className="rounded-2xl border border-slate-700 bg-slate-950/70 p-3"><p className="text-[11px] leading-4 text-slate-400">{label}</p><p className="mt-1 text-sm font-bold text-white">{value}</p></div>)}</div></div><div className="sticky bottom-0 flex justify-end gap-3 border-t border-slate-700 bg-slate-900/95 px-5 py-4 backdrop-blur"><button type="button" onClick={close} className="min-h-11 rounded-xl bg-slate-800 px-4 text-sm font-semibold text-slate-200">Anulează</button><button className="min-h-11 rounded-xl bg-gradient-to-r from-amber-300 to-amber-500 px-5 text-sm font-bold text-slate-950">Salvează eveniment</button></div></form></div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
